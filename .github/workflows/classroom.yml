name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: 'AgeCalcultor '
      id: agecalcultor
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: 'AgeCalcultor '
        setup-command: 'java AgeCalculator '
        command: 'javac AgeCalculator.java '
        input: ''
        expected-output: 'Your age is: 31 years.'
        comparison-method: regex
        timeout: 10
        max-score: 10
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        AGECALCULTOR_RESULTS: "${{steps.agecalcultor.outputs.result}}"
      with:
        runners: agecalcultor
